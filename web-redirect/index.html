<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Jodii...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4ff;
      color: #1a1a1a;
    }
    img { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    p  { margin: 0 0 24px; color: #666; text-align: center; padding: 0 24px; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #007AFF;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <img src="/assets/icon.png" alt="Jodii" />
  <h2>Opening Jodii...</h2>
  <p>If the app doesn't open, download it below.</p>

  <div id="store-link"></div>

  <script>
    const PLAY_STORE  = 'https://play.google.com/store/apps/details?id=jodii.app';
    const APP_STORE   = 'https://apps.apple.com/app/idYOUR_IOS_APP_ID'; // ← replace with real App Store ID
    const APP_SCHEME  = 'jodii://home';

    const ua       = navigator.userAgent || '';
    const isAndroid = /android/i.test(ua);
    const isIOS     = /iphone|ipad|ipod/i.test(ua);

    const linkEl = document.getElementById('store-link');

    if (isAndroid) {
      linkEl.innerHTML = '<a class="btn" href="' + PLAY_STORE + '">Download on Play Store</a>';
      // Try to open app first; if not installed, fall back after 2s
      window.location.href = APP_SCHEME;
      setTimeout(() => { window.location.href = PLAY_STORE; }, 2000);

    } else if (isIOS) {
      linkEl.innerHTML = '<a class="btn" href="' + APP_STORE + '">Download on App Store</a>';
      window.location.href = APP_SCHEME;
      setTimeout(() => { window.location.href = APP_STORE; }, 2000);

    } else {
      // Desktop — show both store links
      linkEl.innerHTML =
        '<a class="btn" href="' + PLAY_STORE + '" style="margin-right:12px">Play Store</a>' +
        '<a class="btn" href="' + APP_STORE  + '">App Store</a>';
    }
  </script>
</body>
</html>
