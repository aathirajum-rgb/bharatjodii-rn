# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for tamilmjodii.com
#
# Upload locations on your server:
#   web/tamiljodii.html  →  /var/www/jodii/tamiljodii.html
#   dist/                →  /var/www/jodii/app/
#
# Enable:
#   sudo ln -s /etc/nginx/sites-available/tamiljodii /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name tamilmjodii.com www.tamilmjodii.com;

    # Redirect HTTP → HTTPS (uncomment after SSL is set up)
    # return 301 https://$host$request_uri;

    root /var/www/jodii;

    # ── Landing page at / ────────────────────────────────────────────────────
    location = / {
        try_files /tamiljodii.html =404;
    }

    location = /tamiljodii.html {
        try_files $uri =404;
    }

    # ── React Native Expo web app at /app/ ───────────────────────────────────
    # All /app/* routes fall back to /app/index.html for SPA client-side routing
    location /app/ {
        alias /var/www/jodii/app/;
        try_files $uri $uri/ /app/index.html;

        # Long cache for hashed static assets (Expo names them with hash)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/html
        application/javascript application/json
        image/svg+xml font/woff font/woff2;
}

