        <script>

                function registerFieldsFromNative(data){
                         console.log('intermediate registerFields From Nativedata')
                          try{

                          let deviceid = '';
                                if(deviceid == ''&& data && data.DEVICEDETAIL && typeof data.DEVICEDETAIL ==="string"){
                                let devicedetail = data.DEVICEDETAIL ? data.DEVICEDETAIL.split(',') : [];
                                if(devicedetail.length > 0){
                                  console.log('devicedetail ------ ',devicedetail[1]);
                                  let _arr = devicedetail.find((item)=>{return item.includes('DEVICEID')});
                                  console.log(_arr);
                                  if(_arr){
                                   deviceid = _arr.split('=')[1] ? _arr.split('=')[1] :'';
                                   const requestData = new Request("https://oapi.jodii.app/registration/partialreg/v1?DEVICEID="+deviceid+"&APPTYPE="+appType, {
                                        method: "POST",
                                          headers: myHeaders
                                        });
                                        getResponseFromServer(requestData);
                                  }
                                }
                          }
                        }catch(e){
                          console.error('registerFieldsFromNativedata error',e)
                        }
                }
                $(document).ready(function () {
                        $('input').click(function () {
                                $('input:not(:checked)').parent().removeClass("checked-radio");
                                $('input:checked').parent().addClass("checked-radio");
                        });
                        $('input:checked').parent().addClass("checked-radio");
                });
                var selectedLanguage='';

                var appversion= getParameterByName('APPVERSION');
                var appType= getParameterByName('APPTYPE');
                var lang= getParameterByName('LANG');
                appType = appType ? appType : "115";
                appversion =appversion ? parseFloat(appversion): 1.3;
                var language=[
                    {"key":"tm","value":"தமிழ்","en_value":"Tamil","alphabet":"அ","lag_class":"tamil","flag":"1"},
                    {"key":"en","value":"English","en_value":"English","alphabet":"A","lag_class":"english","flag":"1"},
                        {"key":"tl","value":"తెలుగు ","en_value":"Telugu","alphabet":"అ","lag_class":"telugu","flag":"1"},
                        {"key":"ml","value":"മലയാളം","en_value":"Malayalam","alphabet":"അ","lag_class":"malayalam","flag":"1"},
                        {"key":"kn","value":"ಕನ್ನಡ ","en_value":"Kannada","alphabet":"ಟ","lag_class":"kannada","flag":"1"},
                        {"key":"mt","value":"मराठी","en_value":"Marathi","alphabet":"અ","lag_class":"marathi","flag":"1"},
                        {"key":"or","value":"ଓଡ଼ିଆ ","en_value":"Odia","alphabet":"ଓ","lag_class":"odia","flag":"1"},
                        {"key":"gj","value":"ગુજરાતી","en_value":"Gujarati","alphabet":"અ","lag_class":"gujarati","flag":"1"},
                        {"key":"bn","value":"বাঙ্গালী","en_value":"Bengali","alphabet":"ক","lag_class":"bengali","flag":"1"},
                        {"key":"hi","value":"हिंदी","en_value":"Hindi","alphabet":"अ","lag_class":"hindi","flag":"1"},
                        {"key":"pa","value":"ਪੰਜਾਬੀ","en_value":"Punjabi","alphabet":"ਪੰ","lag_class":"punjabi","flag":"1"},

                ];
                 language = language.filter((item)=>{
                                if(["116","311","313","320","323","324","332","333","338"].includes(appType)){
                                return ['en','tm'].includes(item.key);
                                }
                                else if(["117","314","315","316","321","326","335"].includes(appType)){
                                  return ['en','tl'].includes(item.key)
                                }
                                else if(["118","302","303","309","317"].includes(appType)){
                                  return ['en','ml'].includes(item.key)
                                }
                                else if(["119","305","308","318","319"].includes(appType)){
                                  return ['en','kn'].includes(item.key)
                                }
                                else if(["120","306","312"].includes(appType)){
                                  return ['en','or'].includes(item.key)
                                }
                                else if(["121"].includes(appType)){
                                  return ['en','bn'].includes(item.key)
                                }
                                else if(["122","330"].includes(appType)){
                                  return ['en','mt'].includes(item.key)
                                }
                                else if(["123","310","322","325"].includes(appType)){
                                  return ['en','gj'].includes(item.key)
                                }
                                else if(["124","304","327","328","336","337"].includes(appType)){
                                  return ['en','hi'].includes(item.key)
                                }
                                else if(["125"].includes(appType)){
                                  return ['en','pa'].includes(item.key)
                                }
                                else if(["301"].includes(appType)){
                                  return ['en','mt','hi'].includes(item.key)
                                }
                                else if(["334"].includes(appType)){
                                  return ['en','tm','tl','kn','ml'].includes(item.key)
                                }
                                else if(["505"].includes(appType)){
                                  return ['en','mt','hi','pa','gj'].includes(item.key)
                                }
                                else if(["506"].includes(appType)){
                                  return ['en','gj','hi','pa'].includes(item.key)
                                }
                                else {
                                  return true;
                                }
                })
                var appTypeLang={
                        "116":"tm",
                        "117":"tl",
                        "118":"ml",
                        "119":"kn",
                        "120":"or",
                        "121":"bn",
                        "122":"mt",
                        "123":"gj",
                        "124":"hi",
                        "125":"pa"
                }
                pageLoad();
                //  {"key":"pu","value":"ਪੰਜਾਬੀ "},
                // var version13_arr = ['hi','tm','tl','en'];
                // var version14_arr = ['hi','tm','tl','bn','mt','en'];
                // var version15_arr = ['hi','tm','tl','bn','mt','gj','or','ml','kn','en'];
                var version13_arr = ['tm','en','tl','hi'];
                var version14_arr = ['tm','en','tl','mt','bn','hi'];
                var version15_arr = ['tm','en','tl','ml','kn','mt','or','gj','bn','hi'];
                var version37_arr = ['tm','en','tl','ml','kn','mt','or','gj','bn','hi','pa'];
                var htmlStr='';
                for(var i=0; i<language.length; i++){
                        var isBinding = true;
                        if(version15_arr.indexOf(language[i]['key'])==-1 && appversion <=3.7){
                                 isBinding = false;
                        }else if(version14_arr.indexOf(language[i]['key'])==-1 && appversion <=1.5){
                                isBinding = false;
                        }else if(version13_arr.indexOf(language[i]['key'])==-1 && appversion <=1.3){
                                isBinding = false;
                        }else if(version13_arr.indexOf(language[i]['key'])==-1 && appversion <=1.2){
                                isBinding = false;
                        }
                        if(isBinding){
                                // htmlStr +='<li><input type="radio" id="lang' +(i+1)+ '" name="language" onclick="callEvent(\''+language[i]['key']+'\');"/><label for="lang' +(i+1)+ '">'+language[i]['value']+'<img src="https://www.jodii.com/assets/img/right-arrow.svg" class="img-responsive right-arrow"></label></li>'
                                // htmlStr +='<li><label for="lang' +(i+1)+ '" class="'+language[i]['lag_class']+'">'+language[i]['value']+' <p class="bottom-lan">'+language[i]['en_value']+'</p> </label> <input type="radio" class="radio-btn-color" color="red" id="lang' +(i+1)+ '" name="language" onclick="onSelectLanguage(\''+language[i]['key']+ '\');"/> <div class="first-letter-alphabet">'+language[i]['alphabet']+'</div></li>';
                                htmlStr +=
                                                `<li>
                                                        <label for="${language[i]['key']}">${language[i]['value']}
                                                                <p class="bottom-lan">${language[i]['en_value']}</p>
                                                        </label>
                                                        <input type="radio" class="radio-btn-color"
                                                                id="${language[i]['key']}" name="language"
                                                                onclick="onSelectLanguage('${language[i]['key']}');" />
                                                        <div class="check"></div>
                                                        <div class="first-letter-alphabet">${language[i]['alphabet']}</div>
                                                </li>`;
                        }
                }
                document.getElementById("underlisting").innerHTML = htmlStr;

                var _lang = lang ? lang : appTypeLang[appType.toString()];
                if(_lang){
                        onSelectLanguage(_lang);
                        $('#'+_lang).trigger('click');
                }

                function getParameterByName(name, url = window.location.href) {
                        name = name.replace(/[\[\]]/g, '\\$&');
                        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                                results = regex.exec(url);
                        if (!results) return null;
                        if (!results[2]) return '';
                        return decodeURIComponent(results[2].replace(/\+/g, ' '));
                }
                function pageLoad(){
                        try{
                                onWebAppsClick.onResponse('{"event_name":"language_select","screen":"JodiiLangSelection"}');
                                setTimeout(()=>{
                                        onWebAppsClick.onResponse(JSON.stringify({"event_name": "page_rendered"}));
                                //      console.log("page_rendered language selection page 2 event call complete")
                                },50);
                        }catch(e){
                                console.log(e)
                        }
                }
                function callEvent(){
                        try{
                                if(selectedLanguage !=''){
                                        $('#errorMsg').text();
                                        console.log('{"event_name":"change_language","lang":"'+ selectedLanguage + '"}');
                                        onWebAppsClick.onResponse('{"event_name":"change_language","lang":"'+ selectedLanguage + '"}');
                                }else{
                                        $('#errorMsg').text('please select atleast one language');
                                        $('#errorMsg').addClass("atleast-language");
                                }
                        }catch(e){
                        }
                }
                function onSelectLanguage(lang)
                {
                        $('#errorMsg').text('');
                        $('#errorMsg').removeClass("atleast-language");
                        $('#nxtbtn').removeClass("disable")
                        selectedLanguage=lang;
                }
                const myHeaders = new Headers();
                  myHeaders.append("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8");

                function getResponseFromServer(request){
                        fetch(request)
                        .then(response => response.json())
                        .then(data => console.log(data))
                        .catch(error => console.error('Error:', error));
                }
