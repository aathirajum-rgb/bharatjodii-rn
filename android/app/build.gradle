// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// App does not use barcode/QR scanning — exclude Google ML Kit's barcode-scanning
// stack (pulled in transitively by expo-camera) to drop its native libs (libbarhopper_v3.so,
// several MB per ABI) from the packaged app.
configurations.all {
    exclude group: "com.google.mlkit", module: "barcode-scanning"
    exclude group: "com.google.android.gms", module: "play-services-code-scanner"
    exclude group: "com.google.android.gms", module: "play-services-mlkit-barcode-scanning"
    exclude group: "androidx.camera", module: "camera-mlkit-vision"
}

dependencies {
    // Razorpay Custom Integration SDK — enables per-UPI-app targeting
    // (getAppsWhichSupportUpi + upi_app_package_name intent flow) and direct
    // card submission, neither of which react-native-razorpay's Standard
    // Checkout SDK (com.razorpay:checkout) supports. These two Razorpay
    // artifacts ship overlapping classes and cannot coexist in one Android
    // build (confirmed: duplicate class com.razorpay.AdvertisingIdUtil etc.)
    // — react-native-razorpay's Android autolinking is disabled in
    // react-native.config.js for exactly this reason; iOS still uses it.
    implementation "com.razorpay:customui:3.9.22"
    // PayU Custom Integration — silent per-account substitute for the
    // Razorpay UPI flow (PAYCONFIG.PAYSOURCE == '2'), matching the old
    // native Android app's behavior. See PayUBridgeModule/PayUWebView.
    implementation("in.payu:upisdk:1.7.2") {
        exclude group: "org.json", module: "json"
    }
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

