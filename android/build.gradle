// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // notifee's own build.gradle adds this via a subproject-triggered
    // `rootProject.allprojects {}` call, which --configure-on-demand
    // (always passed by `expo run:android`) can skip for :app, causing
    // "Could not find app.notifee:core:+". Declare it here at the root
    // so it's registered regardless of configure-on-demand ordering.
    maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
